# Builds MacAwake on every pull request, and on every push to main also publishes a GitHub Release
# with MacAwake.zip. The README links to releases/latest/download/MacAwake.zip, which always points
# at the newest build.
#
# Signing is optional. Without the secrets below the app is ad-hoc signed (users must allow it in
# System Settings › Privacy & Security the first time). With them it's Developer ID signed and notarized.
#   MACOS_CERT_P12        base64 of a "Developer ID Application" .p12 export
#   MACOS_CERT_PASSWORD   password of that .p12
#   MACOS_SIGN_IDENTITY   e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool (app-specific password)
#
# Security (the repo is public, so pull requests can come from anyone):
# - Triggers on `pull_request`, never `pull_request_target`: fork PRs get no secrets and a read-only token.
# - The build job only reads the repo. Only the release job, which runs on main after review, can write.
# - Secrets are passed to the single step that needs each one, never to build.sh.
# - Third-party actions are pinned to a commit SHA. Dependabot proposes updates.
name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "Branding/*.png"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.signed.outputs.text }}
    env:
      # Booleans only, so later `if:` checks can see whether signing is set up without seeing the secrets.
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' && github.event_name != 'pull_request' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Work out version
        id: version
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PW=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          UNIVERSAL: "1"
          ZIP: "1"
        run: ./build.sh

      - name: Notarize
        if: env.SIGN_IDENTITY != '' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit build/MacAwake.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/MacAwake.app
          rm build/MacAwake.zip
          ditto -c -k --keepParent build/MacAwake.app build/MacAwake.zip

      - name: Checksum
        # Run from build/ so the file lists just "MacAwake.zip" and `shasum -c` works after download.
        run: cd build && shasum -a 256 MacAwake.zip | tee MacAwake.zip.sha256

      - name: Describe signing
        id: signed
        run: |
          if [ -n "${SIGN_IDENTITY:-}" ]; then t="Developer ID signed and notarized."; else
            t="Ad-hoc signed: the first time, open it from System Settings › Privacy & Security › Open Anyway."; fi
          echo "text=$t" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MacAwake-${{ steps.version.outputs.version }}
          path: |
            build/MacAwake.zip
            build/MacAwake.zip.sha256

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job can create releases
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MacAwake-${{ needs.build.outputs.version }}
          path: build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          gh release create "v${VERSION}" build/MacAwake.zip build/MacAwake.zip.sha256 \
            --title "MacAwake ${VERSION}" \
            --notes "Built from ${GITHUB_SHA::7}. Universal (Apple silicon + Intel), macOS 14 or later. ${SIGNED}" \
            --target "$GITHUB_SHA" --latest
